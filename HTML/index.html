<!DOCTYPE html>
<html>
<head>
  <title>HOPE YOUTH MINISTRY</title>
  <style>
    body {
      position: relative;
      font-family: "Times New Roman", sans-serif;
      background-image: url("bg.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #E8E2D1;
      text-align: center;
      padding: 50px;
      margin: 0;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .logo {
      position: relative;
      z-index: 1;
      width: 400px;
      height: auto;
      margin-bottom: 10px;
    }

    h1 {
      position: relative;
      z-index: 1;
      font-size: 90px;
      margin-top: 20px;
      margin-bottom: 10px;
      color: #E8E2D1;
    }

    p {
      position: relative;
      z-index: 1;
      font-size: 70px;
      color: #E8E2D1;
      margin-top: 50px;
      margin-bottom: 20px;
    }

    .info-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-top: 100px;
      position: relative;
      z-index: 1;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .icon {
      width: 50px;
      height: 50px;
      fill: none;
      stroke: #E8E2D1;
      stroke-width: 1.5;
    }

    .info-text {
      display: flex;
      flex-direction: column;
      text-align: left;
      font-size: 22px;
      letter-spacing: 1px;
      color: #E8E2D1;
    }

    .info-text strong {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .divider {
      width: 1px;
      height: 60px;
      background-color: #E8E2D1;
    }

   .social-label {
  position: relative;
  z-index: 1;
  font-size: 24px;
  letter-spacing: 1px;
  color: #E8E2D1;
  margin-top: 100px;   /* increased from 80px */
  margin-bottom: 20px;
   }

    .social-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      position: relative;
      z-index: 1;
    }

    .social-item {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 22px;
      color: #E8E2D1;
      text-decoration: none;
      cursor: pointer;
    }

    .social-item:hover {
      opacity: 0.8;
    }

    .social-icon {
      width: 50px;
      height: 50px;
    }
  </style>
</head>
<body>
  <img src="logo.png" alt="Hope YM Logo" class="logo">
  <h1>HOPE YOUTH MINISTRY</h1>
  <p>YOU'RE INVITED!</p>

  <div class="info-bar">
    <div class="info-item">
      <svg class="icon" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <div class="info-text">
        <strong>1ST & 3RD SUNDAYS</strong>
        <span>1:30 PM</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="info-item">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11z"></path>
        <circle cx="12" cy="10" r="2.5"></circle>
      </svg>
      <div class="info-text">
        <strong>LORD OF HOPE CHURCH</strong>
        <span>NOVELETA 4105</span>
      </div>
    </div>
  </div>

  <div class="social-label">STAY UPDATED AND FOLLOW US HERE:</div>

  <div class="social-bar">
    <a href="https://www.instagram.com/hopeyouthm/" target="_blank" class="social-item">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="#E8E2D1" stroke-width="1.5">
        <rect x="2" y="2" width="20" height="20" rx="5"></rect>
        <circle cx="12" cy="12" r="4.5"></circle>
        <circle cx="17.5" cy="6.5" r="1" fill="#E8E2D1" stroke="none"></circle>
      </svg>
      <span>@hopeyouthm</span>
    </a>

    <div class="divider"></div>

    <a href="https://www.facebook.com/profile.php?id=61576485620818" target="_blank" class="social-item">
      <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="#E8E2D1" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M13.5 21v-7h2.2l0.3-2.7h-2.5V9.5c0-0.8 0.2-1.3 1.3-1.3h1.3V5.8c-0.2 0-1-0.1-1.9-0.1-1.9 0-3.2 1.2-3.2 3.3v1.8H8.5v2.7H11v7h2.5z"></path>
      </svg>
      <span>Hope Youth Ministry</span>
    </a>
  </div>
</body>
</html>
